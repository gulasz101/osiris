# The gate on every pull request: scripts/check.sh (game files, node tests, cargo test,
# wasm check, openspec). The ruleset on main requires this job ("check") to pass, and the
# code factory merges a pull request only when it is green.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: scripts/check.sh
        run: sh scripts/check.sh
