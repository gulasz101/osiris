[package]
name = "osiris-app"
description = "The Osiris game"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "osiris"
path = "src/main.rs"

[dependencies]
osiris-formats = { path = "../osiris-formats" }
osiris-render = { path = "../osiris-render" }
osiris-sim = { path = "../osiris-sim" }
osiris-ui = { path = "../osiris-ui" }
osiris-audio = { path = "../osiris-audio" }
osiris-bink = { path = "../osiris-bink" }
osiris-vfs = { path = "../osiris-vfs" }
wgpu = "30"
winit = "0.30"
pollster = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
png = "0.18"
toml = "0.9"
rfd = "0.17"
web-time = "1.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Performance",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "console",
] }
