[package]
name = "osiris-audio"
description = "Music, effects, speech and city ambience playback for Osiris"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
osiris-vfs = { path = "../osiris-vfs" }
rodio = "0.22"
toml = "0.9"
thiserror = "2"
rand = "0.10"

# The browser has no cpal host unless the WebAudio backend is compiled in; without the feature
# the build is silent and `Audio::new` quietly returns a mute value.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rodio = { version = "0.22", features = ["wasm-bindgen"] }
# rodio's dither and this crate's own music picker reach `rand`, which needs getrandom's browser
# backend; without the feature getrandom refuses to compile for wasm32-unknown-unknown.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
