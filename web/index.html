<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osiris: Pharaoh in your browser</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: sans-serif; background: #1a1a2e; color: #eee; }
        /* The game's canvas fills the window; the start page sits over it until the game
           starts. `[hidden]` has to be spelled out: `display: block` here would otherwise
           beat the browser's own rule for the hidden attribute. */
        #osiris { display: block; background: #000; }
        #osiris[hidden] { display: none; }
        #start {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; gap: 1em; text-align: center;
        }
        h1 { font-size: 1.8rem; }
        p { max-width: 40ch; opacity: 0.85; }
        #status { margin-top: 1em; color: #ffd700; min-height: 1.5em; }
        #start.drag { outline: 3px dashed #ffd700; }
        /* The start page covers the game once the game is running, so the corner link can
           bring it back over the top. */
        #start.over-game {
            position: fixed; inset: 0; z-index: 1; background: #1a1a2e;
            overflow: auto; padding: 1em;
        }
        /* The game's own controls, small and out of the way, over the canvas. */
        #controls {
            position: fixed; right: 0.75em; bottom: 0.75em; z-index: 2;
            display: flex; gap: 0.4em;
        }
        #controls[hidden] { display: none; }
        #controls button {
            padding: 0.2em 0.6em; font-size: 0.75rem; color: #ddd;
            background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.3em; cursor: pointer;
        }
        #controls button:hover { color: #1a1a2e; background: #ffd700; }
        /* Small, out of the way, and reachable while the game covers the page. The game's
           own controls sit in the right corner, so this one takes the left. */
        #forget {
            position: fixed; left: 0.75em; bottom: 0.75em; padding: 0.2em 0.6em;
            font-size: 0.75rem; color: #ddd; background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 0.3em; cursor: pointer;
        }
        #forget:hover { color: #1a1a2e; background: #ffd700; }
        /* The bar over everything while the game files are read: it covers the canvas, or
           the start page before the game starts, so the page never looks dead. It takes no
           clicks, so a folder can still be dropped on the page under it. */
        #progress {
            position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 0.6em;
            background: rgba(26, 26, 46, 0.85); pointer-events: none;
        }
        #progress[hidden] { display: none; }
        #progress-track {
            width: min(60ch, 80vw); height: 1em; border: 1px solid #ffd700;
            border-radius: 0.3em; overflow: hidden;
        }
        #progress-fill { width: 0; height: 100%; background: #ffd700; }
        #progress-text { color: #ffd700; }
        /* The Saves panel covers everything, over the canvas and the progress bar, so the
           player can reach it while the game is playing. `[hidden]` is spelled out again,
           as it is for the start page. */
        #saves {
            position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column;
            gap: 0.7em; padding: 1.2em; overflow: auto;
            background: rgba(26, 26, 46, 0.95);
        }
        #saves[hidden] { display: none; }
        #saves h2 { font-size: 1.2rem; color: #ffd700; }
        #saves table { border-collapse: collapse; width: 100%; }
        #saves th, #saves td { padding: 0.3em 0.6em; text-align: left; font-size: 0.9rem; }
        #saves th { color: #ffd700; font-weight: normal; }
        #saves tr:nth-child(even) td { background: rgba(255, 255, 255, 0.05); }
        #saves button {
            padding: 0.1em 0.5em; font-size: 0.8rem; color: #ddd;
            background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.3em; cursor: pointer;
        }
        #saves button:hover { color: #1a1a2e; background: #ffd700; }
        #saves-status { color: #ffd700; min-height: 1.2em; font-size: 0.85rem; }
    </style>
</head>
<body>
    <canvas id="osiris" hidden></canvas>
    <div id="start">
        <h1>Osiris: Pharaoh in your browser</h1>
        <p>Choose the folder where Pharaoh is installed. The files stay on your computer; nothing is uploaded.</p>
        <input type="file" id="folder" webkitdirectory multiple />
        <p>or drag the Pharaoh folder here</p>
        <p id="status"></p>
    </div>
    <button id="forget" hidden>Forget game files</button>
    <div id="progress" hidden>
        <div id="progress-track"><div id="progress-fill"></div></div>
        <p id="progress-text"></p>
    </div>
    <div id="controls" hidden>
        <button id="saves-button">Saves</button>
        <button id="fullscreen">Fullscreen</button>
        <button id="page">Page</button>
    </div>
    <div id="saves" hidden>
        <h2>Saves</h2>
        <table>
            <thead>
                <tr><th>Family</th><th>File</th><th>Size</th><th>Date</th><th></th><th></th></tr>
            </thead>
            <tbody id="saves-rows"></tbody>
        </table>
        <p id="saves-status"></p>
        <p>Import a save into this family's saves folder:
            <input type="file" id="import" accept=".osiris" /></p>
        <button id="saves-close">Close</button>
    </div>
    <script src="store.js"></script>
    <script src="audio.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
