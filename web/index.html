<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osiris: Pharaoh in your browser</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: sans-serif; background: #1a1a2e; color: #eee; }
        /* The game's canvas fills the window; the start page sits over it until the game
           starts. `[hidden]` has to be spelled out: `display: block` here would otherwise
           beat the browser's own rule for the hidden attribute. */
        #osiris { display: block; background: #000; }
        #osiris[hidden] { display: none; }
        #start {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 100vh; gap: 1em; text-align: center;
        }
        h1 { font-size: 1.8rem; }
        p { max-width: 40ch; opacity: 0.85; }
        #status { margin-top: 1em; color: #ffd700; min-height: 1.5em; }
        #start.drag { outline: 3px dashed #ffd700; }
        /* Small, out of the way, and reachable while the game covers the page. */
        #forget {
            position: fixed; right: 0.75em; bottom: 0.75em; padding: 0.2em 0.6em;
            font-size: 0.75rem; color: #ddd; background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 0.3em; cursor: pointer;
        }
        #forget:hover { color: #1a1a2e; background: #ffd700; }
    </style>
</head>
<body>
    <canvas id="osiris" hidden></canvas>
    <div id="start">
        <h1>Osiris: Pharaoh in your browser</h1>
        <p>Choose the folder where Pharaoh is installed. The files stay on your computer; nothing is uploaded.</p>
        <input type="file" id="folder" webkitdirectory multiple />
        <p>or drag the Pharaoh folder here</p>
        <p id="status"></p>
    </div>
    <button id="forget" hidden>Forget game files</button>
    <script src="store.js"></script>
    <script src="audio.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
